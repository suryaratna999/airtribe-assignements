server.port=8080
spring.datasource.url=jdbc:h2:file:./data/recipe-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

security.jwt.secret=changeit-please-set-a-secure-secret
security.jwt.expirationSeconds=3600

file.upload-dir=uploads

# Disable Spring automatic shutdown hook to avoid logging during JVM shutdown that can cause NoClassDefFoundError for logging classes in this dev scaffold
spring.main.register-shutdown-hook=false

# make logging explicit
logging.level.root=INFO
