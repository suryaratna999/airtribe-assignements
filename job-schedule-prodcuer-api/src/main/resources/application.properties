# JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Avoid connecting to the DB for JDBC metadata during bootstrap (helps when DNS/DB is temporarily unreachable)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Use Spring's provided implicit naming strategy (if available) or leave unset to use defaults
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
# Use Hibernate's CamelCaseToUnderscoresNamingStrategy for physical names (this class is present in Hibernate 6)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Make dates readable in JSON
spring.jackson.serialization.write-dates-as-timestamps=false

