spring.application.name=job-schedule-consumer-api

# 1. Headless Mode: Disables the embedded Tomcat/Web server
spring.main.web-application-type=none

# 2. Supabase Connection (Same as Producer)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ufrzthijvnnzvamaahao
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate Settings (Mirrored from Producer for consistency)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 4. Naming Strategies (CRITICAL: Must match Producer to find the 'jobs' table correctly)
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# 5. Thread Pooling (Optimizing for background execution)
# Defines how many background workers run in parallel
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25